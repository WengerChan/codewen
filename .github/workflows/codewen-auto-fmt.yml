name: codewen-auto-fmt

on:
  workflow_dispatch:

jobs:
  fmt:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codewen-rename-full-ci
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: cargo fmt --all
        working-directory: codewen-rs
        run: cargo fmt --all

      - name: Auto-commit formatting
        run: |
          git config user.email "codewen-bot@users.noreply.github.com"
          git config user.name "codewen-bot"
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git add -A
          git commit -m "chore: cargo fmt --all"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:codewen-rename-full-ci
