[package]
name = "codewen-backend-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = { workspace = true }
url = { workspace = true }
codewen-backend-openapi-models = { path = "../codewen-backend-openapi-models" }
codewen-api = { workspace = true }
codewen-http-client = { workspace = true }
codewen-login = { workspace = true }
codewen-model-provider = { workspace = true }
codewen-protocol = { workspace = true }

[dev-dependencies]
pretty_assertions = "1"
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
