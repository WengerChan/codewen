[package]
name = "codewen-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "codewen"
path = "src/main.rs"

[lib]
name = "codewen_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
codewen-app-server = { workspace = true }
codewen-app-server-daemon = { workspace = true }
codewen-app-server-protocol = { workspace = true }
codewen-app-server-test-client = { workspace = true }
codewen-arg0 = { workspace = true }
codewen-api = { workspace = true }
codewen-chatgpt = { workspace = true }
codewen-cloud-tasks = { path = "../cloud-tasks" }
codewen-utils-cli = { workspace = true }
codewen-config = { workspace = true }
codewen-core = { workspace = true }
codewen-core-plugins = { workspace = true }
codewen-home = { workspace = true }
codewen-http-client = { workspace = true }
codewen-exec = { workspace = true }
codewen-exec-server = { workspace = true }
codewen-execpolicy = { workspace = true }
codewen-features = { workspace = true }
codewen-git-utils = { workspace = true }
codewen-install-context = { workspace = true }
codewen-login = { workspace = true }
codewen-memories-write = { workspace = true }
codewen-mcp = { workspace = true }
codewen-mcp-server = { workspace = true }
codewen-model-provider = { workspace = true }
codewen-models-manager = { workspace = true }
codewen-plugin = { workspace = true }
codewen-protocol = { workspace = true }
codewen-responses-api-proxy = { workspace = true }
codewen-rmcp-client = { workspace = true }
codewen-rollout = { workspace = true }
codewen-rollout-trace = { workspace = true }
codewen-sandboxing = { workspace = true }
codewen-state = { workspace = true }
codewen-stdio-to-uds = { workspace = true }
codewen-terminal-detection = { workspace = true }
codewen-tui = { workspace = true }
codewen-utils-absolute-path = { workspace = true }
codewen-utils-path = { workspace = true }
crossterm = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
codewen_windows_sandbox = { package = "codewen-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
app_test_support = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
codewen-utils-cargo-bin = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
# These Rust sources are intentionally Bazel-only macrobenchmarks rather than
# Cargo targets.
ignored-paths = ["e2e_benches/*.rs"]
