[package]
name = "codewen-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codewen_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codewen-app-server = { workspace = true }
codewen-app-server-protocol = { workspace = true }
codewen-arg0 = { workspace = true }
codewen-config = { workspace = true }
codewen-core = { workspace = true }
codewen-exec-server = { workspace = true }
codewen-feedback = { workspace = true }
codewen-protocol = { workspace = true }
codewen-uds = { workspace = true }
codewen-utils-absolute-path = { workspace = true }
codewen-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
