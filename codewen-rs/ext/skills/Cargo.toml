[package]
edition.workspace = true
license.workspace = true
name = "codewen-skills-extension"
version.workspace = true

[lib]
name = "codewen_skills_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codewen-core-skills = { workspace = true }
codewen-exec-server = { workspace = true }
codewen-extension-api = { workspace = true }
codewen-mcp = { workspace = true }
codewen-otel = { workspace = true }
codewen-protocol = { workspace = true }
codewen-skills = { workspace = true }
codewen-tools = { workspace = true }
codewen-utils-path-uri = { workspace = true }
codewen-utils-string = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
codewen-models-manager = { workspace = true }
codewen-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
