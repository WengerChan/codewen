[package]
edition.workspace = true
license.workspace = true
name = "codewen-goal-extension"
version.workspace = true

[lib]
name = "codewen_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
codewen-analytics = { workspace = true }
codewen-core = { workspace = true }
codewen-extension-api = { workspace = true }
codewen-otel = { workspace = true }
codewen-protocol = { workspace = true }
codewen-state = { workspace = true }
codewen-tools = { workspace = true }
codewen-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
