[package]
edition.workspace = true
license.workspace = true
name = "codewen-memories-extension"
version.workspace = true

[lib]
name = "codewen_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codewen-core = { workspace = true }
codewen-extension-api = { workspace = true }
codewen-features = { workspace = true }
codewen-otel = { workspace = true }
codewen-tools = { workspace = true }
codewen-utils-absolute-path = { workspace = true }
codewen-utils-output-truncation = { workspace = true }
codewen-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
